<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery with Search</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header and Search Container -->
    <header>
        <h1>Image Gallery</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search images by specific name (e.g., '14.jpg')">
            <button type="button" id="searchButton">Search</button>
        </div>
    </header>

    <!-- Main Image Grid Container (Starts empty, populated by JS) -->
    <main class="gallery-grid" id="galleryGrid">
        <!-- Images will be inserted here dynamically -->
    </main>

    <!-- Link to the external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
