<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<pre></pre> <!-- Preserves whitespace/line breaks -->

<section></section> <!-- Groups related thematic content -->

<article></article> <!-- Independent, self-contained content -->

<aside></aside> <!-- Content indirectly related to main text (sidebar) -->

<address></address> <!-- Contact info for author/owner -->

<abbr title=""></abbr> <!-- Defines an abbreviation or acronym -->

<mark>Hello</mark> <!-- Highlights/marks specific text -->

<cite></cite> <!-- References a creative work (title) -->

<time datetime=""></time> <!-- Machine-readable date/time -->

<select name="" id=""></select> <!-- Creates a dropdown list -->

<option value=""></option> <!-- Single item inside a dropdown -->

<optgroup></optgroup> <!-- Groups related options in a list -->

<progress></progress> <!-- Displays task completion status bar -->

<datalist></datalist> <!-- Provides autocomplete options for input -->

<label for=""></label> <!-- Caption for a form element -->

<figure></figure> <!-- Encapsulates media like photos or diagrams -->

<figcaption></figcaption> <!-- Caption for a <figure> element -->

    <embed src="" type=""> <!-- Container for external application/plugin -->

        <object data="" type=""></object> <!-- Embeds external resources (PDF, Flash) -->

<!-- Character Entities -->

&copy; <!-- Copyright symbol (©) -->

&amp; <!-- Ampersand symbol (&) -->

&gt; <!-- Greater than symbol (>) -->

&lt; <!-- Less than symbol (<) -->

&dollar; <!-- Dollar sign ($) -->

&quot; <!-- Double quotation mark (") -->

&apos; <!-- Single quotation mark (') -->



<!-- Metadata -->

<link rel="stylesheet" href=""> <!-- Links an external CSS file -->

<!-- Event Attributes -->

onclick <!-- Fires when element is clicked -->

onmouseover <!-- Fires when mouse moves over element -->

onchange <!-- Fires when element value changes -->

onload <!-- Fires after the page/image loads -->

onkeydown <!-- Fires when a key is pressed down -->

onfocus <!-- Fires when element gets focus -->
